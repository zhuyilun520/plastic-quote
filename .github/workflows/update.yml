name: 更新行情数据

on:
  schedule:
    # 时间为 UTC, 对应北京时间 07:00 / 12:00 / 17:30
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取数据
        run: python scripts/fetch_data.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 更新行情数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
