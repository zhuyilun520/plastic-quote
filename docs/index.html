<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>塑料原料行情</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M14 40 L25 30 L34 35 L50 18' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="塑料行情">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1d24; --sub:#667085;
  --line:#e4e7ec; --up:#d92d20; --down:#079455; --flat:#667085;
  --tagbg:#f2f4f7; --low:#0e7090; --high:#b54708; --accent:#2563eb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 44px}
header{padding:20px 4px 6px;display:flex;align-items:flex-start;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.5px}
.meta{color:var(--sub);font-size:12px;margin-top:5px}
.refresh{background:none;border:1px solid var(--line);border-radius:8px;color:var(--sub);
  font-size:12px;padding:5px 10px;margin-top:2px}
h2{font-size:14px;color:var(--sub);font-weight:600;margin:20px 2px 8px;letter-spacing:1px}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(16,24,40,.05)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.oilcard{background:var(--card);border-radius:14px;padding:11px 11px 8px;
  box-shadow:0 1px 2px rgba(16,24,40,.05);min-width:0;overflow:hidden}
.olabel{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oprice{font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap}
.oprice small{font-size:10px;color:var(--sub);font-weight:400;margin-left:2px}
.opct{font-size:12px;font-weight:600}
.osub{font-size:10px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:100%;height:34px;margin-top:4px}
.spark.big{height:56px;margin:8px 0 2px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:16px;font-weight:700}
.name .tag{font-size:10px;font-weight:500;color:var(--accent);background:#eff4ff;
  border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:2px}
.price-line{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.price{font-size:27px;font-weight:700;letter-spacing:.3px}
.price small{font-size:12px;color:var(--sub);font-weight:400;margin-left:3px}
.pct{font-size:14px;font-weight:700}
.sub{font-size:12px;color:var(--sub);margin-top:2px}
.spotline{font-size:12.5px;color:#344054;margin-top:6px;background:#f8f9fb;
  border-radius:8px;padding:6px 9px}
.spotline b{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{font-size:11px;background:var(--tagbg);color:#475467;border-radius:6px;padding:2px 7px}
.pill.low{background:#ecfdf3;color:#067647}
.pill.high{background:#fef3f2;color:#b42318}
.pill.info{background:#eff8ff;color:#175cd3}
.chartbar{display:flex;gap:5px;margin-top:8px}
.chartbar button{flex:1;font-size:11px;padding:4px 0;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--sub)}
.chartbar button.on{background:#eef4ff;border-color:#b2ccff;color:var(--accent);font-weight:600}
.sigrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sigrow:last-child{border-bottom:none;padding-bottom:0}
.sigrow:first-child{padding-top:0}
.sigcode{width:44px;font-weight:700;font-size:14px;flex:none;padding-top:1px}
.sigmain{flex:1;min-width:0}
.sigline1{font-size:13px;color:#344054}
.sigline2{font-size:11.5px;color:var(--sub);margin-top:2px}
.pos{font-weight:600}
table.mini{width:100%;border-collapse:collapse;font-size:12px;color:#344054}
table.mini th{color:var(--sub);font-weight:500;text-align:right;padding:4px 2px;border-bottom:1px solid var(--line)}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini td{padding:5px 2px;text-align:right;border-bottom:1px solid #f2f4f7}
table.mini tr:last-child td{border-bottom:none}
.bars{margin-top:4px}
.bar{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px}
.bar .bl{width:52px;color:#475467;flex:none}
.bar .btrack{flex:1;height:14px;background:#f2f4f7;border-radius:4px;position:relative;overflow:hidden}
.bar .bmid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#d0d5dd}
.bar .bfill{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.85}
.bar .bv{width:56px;text-align:right;font-weight:600;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;font-size:13px;padding:5px 12px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:var(--sub)}
.tabs button.on{background:#1a1d24;border-color:#1a1d24;color:#fff;font-weight:600}
.news{display:block;background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px;
  text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.ntop{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--sub)}
.ntag{color:var(--accent)}
.ntitle{font-size:14px;font-weight:600;margin-top:3px;line-height:1.45}
.nsum{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:22px 0}
footer{margin-top:26px;padding:14px 4px 0;border-top:1px solid var(--line);
  color:#98a2b3;font-size:11px;line-height:1.7}
.warnbar{background:#fffaeb;color:#b54708;border-radius:10px;padding:8px 11px;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>塑料原料行情</h1>
      <div class="meta">更新于 <span id="gen">--</span> · 新浪财经 / 生意社</div>
    </div>
    <button class="refresh" onclick="loadData(true)">刷新</button>
  </header>

  <section>
    <h2>原油</h2>
    <div class="grid3" id="oil"></div>
  </section>

  <section>
    <h2>塑料原料</h2>
    <div id="plastic"></div>
  </section>

  <section>
    <h2>备货参考</h2>
    <div class="card" id="signals"></div>
    <p style="font-size:11px;color:#98a2b3;margin:6px 4px 0">
      以上为公开行情的统计描述，仅供参考，不构成投资建议。</p>
  </section>

  <section>
    <h2>原油 → 原料传导</h2>
    <div class="card" id="trans"></div>
  </section>

  <section>
    <h2>行业资讯</h2>
    <div class="tabs" id="tabs"></div>
    <div id="news"></div>
  </section>

  <footer>
    数据来源：新浪财经（期货行情、历史K线、财经快讯）、生意社（现货报价、商品资讯）。<br>
    期货为实时价（主力连续合约，波动以昨结算价为基准）；现货为生意社最新采样价。
    每天 07:00 / 12:00 / 17:30 自动更新。<br>
    本页仅作行情信息参考，不构成投资建议。
  </footer>
</div>

<script>
"use strict";
var DATA = null;
var NEWS_TAB = "all";

var OIL = [
  {key:"BRENT", fut:"hf_OIL", kline:"BRENT", label:"布伦特", unit:"美元/桶"},
  {key:"WTI",   fut:"hf_CL",  kline:"WTI",   label:"WTI",   unit:"美元/桶"},
  {key:"SC",    fut:"nf_SC0", kline:"SC",    label:"SC原油", unit:"元/桶"}
];

var PLASTIC = [
  {key:"PP",  sig:"PP", fut:"nf_PP0", kline:"PP", label:"PP 聚丙烯",  futTag:"期货·主力连续"},
  {key:"PE",  sig:"L",  fut:"nf_L0",  kline:"L",  label:"PE 聚乙烯",  futTag:"期货·LLDPE主力"},
  {key:"PVC", sig:"V",  fut:"nf_V0",  kline:"V",  label:"PVC 聚氯乙烯", futTag:"期货·主力连续"},
  {key:"ABS", label:"ABS", spotOnly:true},
  {key:"PS",  label:"GPPS 聚苯乙烯", spotOnly:true}
];

function fmt(n, d) {
  if (n === null || n === undefined || isNaN(n)) return "--";
  d = (d === undefined) ? 0 : d;
  return Number(n).toLocaleString("zh-CN", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function pctText(n) {
  if (n === null || n === undefined || isNaN(n)) return "--";
  return (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%";
}
function cls(n) {
  if (n === null || n === undefined || isNaN(n)) return "flat";
  return n > 0 ? "up" : (n < 0 ? "down" : "flat");
}
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function shortTime(t) {
  if (!t) return "";
  var m = String(t).match(/(\d{2})-(\d{2})[ T](\d{2}):(\d{2})/);
  if (m) return m[1] + "-" + m[2] + " " + m[3] + ":" + m[4];
  return t;
}

function sparkline(values, w, h, big) {
  if (!values || values.length < 2) return "";
  w = w || 200; h = h || 34;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var span = (max - min) || 1;
  var pad = 3;
  var step = (w - pad * 2) / (values.length - 1);
  var pts = values.map(function(v, i) {
    return [pad + i * step, h - pad - (v - min) / span * (h - pad * 2)];
  });
  var d = pts.map(function(p, i) {
    return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1);
  }).join(" ");
  var area = d + " L" + (w - pad).toFixed(1) + " " + h + " L" + pad + " " + h + " Z";
  var rising = values[values.length - 1] >= values[0];
  var color = rising ? "#d92d20" : "#079455";
  var gid = "sg" + Math.random().toString(36).slice(2, 8);
  return '<svg class="spark' + (big ? " big" : "") + '" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + color + '" stop-opacity=".16"/>' +
    '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6" ' +
    'stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function posInfo(pos) {
  if (pos === null || pos === undefined) return {text:"--", label:""};
  if (pos <= 20) return {text:pos.toFixed(0) + "%", label:"低位", cls:"low"};
  if (pos >= 80) return {text:pos.toFixed(0) + "%", label:"高位", cls:"high"};
  return {text:pos.toFixed(0) + "%", label:"中位", cls:""};
}

function hintText(sig) {
  if (!sig) return "";
  var parts = [];
  if (sig.pos90 !== undefined && sig.pos90 !== null) {
    if (sig.pos90 <= 20) parts.push("处于近90日低位");
    else if (sig.pos90 >= 80) parts.push("处于近90日高位");
    else parts.push("处于近90日" + sig.pos90.toFixed(0) + "%分位");
  }
  if (sig.streak >= 3) parts.push("已连涨" + sig.streak + "日");
  if (sig.streak <= -3) parts.push("已连跌" + (-sig.streak) + "日");
  if (sig.ratio_pos90 !== undefined && sig.ratio_pos90 !== null) {
    if (sig.ratio_pos90 >= 80) parts.push("相对原油偏贵");
    else if (sig.ratio_pos90 <= 20) parts.push("相对原油偏便宜");
  }
  return parts.join("，");
}

function klineValues(klineKey, n) {
  var arr = (DATA.klines || {})[klineKey] || [];
  var vals = arr.map(function(x) { return x.c; });
  return vals.slice(Math.max(0, vals.length - n));
}

function renderOil() {
  var el = document.getElementById("oil");
  el.innerHTML = OIL.map(function(o) {
    var f = (DATA.futures || {})[o.fut];
    if (!f) {
      return '<div class="oilcard"><div class="olabel">' + o.label +
        '</div><div class="oprice">--</div></div>';
    }
    var v = klineValues(o.kline, 60);
    return '<div class="oilcard">' +
      '<div class="olabel">' + o.label + "</div>" +
      '<div class="oprice ' + cls(f.pct) + '">' + fmt(f.price, f.price < 200 ? 2 : 1) +
      "<small>" + o.unit + "</small></div>" +
      '<div class="opct ' + cls(f.pct) + '">' + pctText(f.pct) + "</div>" +
      '<div class="osub">' + (f.date || "") + "</div>" +
      sparkline(v, 140, 28) +
      "</div>";
  }).join("");
}

function renderPlastic() {
  var el = document.getElementById("plastic");
  el.innerHTML = PLASTIC.map(function(p) {
    var spot = (DATA.spot || {})[p.key];
    var sig = p.sig ? (DATA.signals || {})[p.sig] : null;
    var f = p.fut ? (DATA.futures || {})[p.fut] : null;
    var html = '<div class="card">';
    html += '<div class="head"><span class="name">' + p.label;
    if (!p.spotOnly) html += '<span class="tag">' + p.futTag + "</span>";
    else html += '<span class="tag" style="color:#067647;background:#ecfdf3">现货报价</span>';
    html += "</span>";
    if (f) html += '<span class="pct ' + cls(f.pct) + '">' + pctText(f.pct) + "</span>";
    html += "</div>";

    if (!p.spotOnly && f) {
      html += '<div class="price-line"><span class="price">' + fmt(f.price) +
        '<small>元/吨</small></span></div>';
      html += '<div class="sub">' + (f.date || "") + " · 昨结 " + fmt(f.prev_settle) + "</div>";
    }

    if (p.spotOnly && spot) {
      html += '<div class="price-line"><span class="price">' + fmt(spot.median) +
        '<small>元/吨</small></span></div>';
      html += '<div class="sub">' + (spot.date || "") + " · " + spot.count +
        " 条最新报价中位数</div>";
    }

    if (!p.spotOnly && spot) {
      var basis = null, basisPct = null;
      if (spot.spot && spot.main_price) {
        basis = spot.spot - spot.main_price;
        basisPct = basis / spot.main_price * 100;
      }
      html += '<div class="spotline">现货 <b>' + fmt(spot.spot, 2) + "</b> 元/吨";
      if (basis !== null) {
        html += " · 较主力" + spot.main_contract + "基差 <b>" +
          (basis > 0 ? "+" : "") + fmt(basis, 0) + "（" + pctText(basisPct) + "）</b>";
      }
      html += '<span style="color:#98a2b3"> · ' + (spot.date || "") + "</span></div>";
    }

    if (!p.spotOnly) {
      html += '<div class="chartbar">' +
        '<button data-k="' + p.kline + '" data-n="30" onclick="switchRange(this)">近30日</button>' +
        '<button class="on" data-k="' + p.kline + '" data-n="60" onclick="switchRange(this)">近60日</button>' +
        '<button data-k="' + p.kline + '" data-n="90" onclick="switchRange(this)">近90日</button>' +
        "</div>";
      html += '<div id="chart-' + p.kline + '">' + sparkline(klineValues(p.kline, 60), 300, 56, true) + "</div>";
    }

    if (sig) {
      var pi = posInfo(sig.pos90);
      var pills = [];
      if (sig.pos90 !== null && sig.pos90 !== undefined) {
        pills.push('<span class="pill ' + pi.cls + '">近90日' + pi.text + " " + pi.label + "</span>");
      }
      if (sig.streak >= 3) pills.push('<span class="pill high">连涨' + sig.streak + "日</span>");
      if (sig.streak <= -3) pills.push('<span class="pill low">连跌' + (-sig.streak) + "日</span>");
      if (sig.ratio_pos90 !== null && sig.ratio_pos90 !== undefined) {
        if (sig.ratio_pos90 >= 80) pills.push('<span class="pill high">相对原油偏贵</span>');
        else if (sig.ratio_pos90 <= 20) pills.push('<span class="pill low">相对原油偏便宜</span>');
      }
      if (pills.length) html += '<div class="pills">' + pills.join("") + "</div>";
    }

    if (p.spotOnly) {
      html += '<div class="pills"><span class="pill info">数据积累中，暂无法计算历史分位</span></div>';
    }

    html += "</div>";
    return html;
  }).join("");
}

function switchRange(btn) {
  var card = btn.closest(".chartbar");
  var btns = card.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) btns[i].className = "";
  btn.className = "on";
  var k = btn.getAttribute("data-k");
  var n = parseInt(btn.getAttribute("data-n"), 10);
  var holder = document.getElementById("chart-" + k);
  if (holder) {
    var svg = sparkline(klineValues(k, n), 300, 56, true);
    if (svg) holder.innerHTML = svg;
  }
}

function renderSignals() {
  var el = document.getElementById("signals");
  var rows = [
    {code:"PP",  sig:"PP", label:"PP"},
    {code:"PE",  sig:"L",  label:"PE"},
    {code:"PVC", sig:"V",  label:"PVC"}
  ];
  var html = "";
  rows.forEach(function(r) {
    var s = (DATA.signals || {})[r.sig];
    if (!s) return;
    var pi = posInfo(s.pos90);
    html += '<div class="sigrow"><div class="sigcode">' + r.label + "</div>" +
      '<div class="sigmain"><div class="sigline1">' +
      "近90日 <span class=\"pos " + (pi.cls === "low" ? "down" : (pi.cls === "high" ? "up" : "")) +
      "\">" + pi.text + "</span> " + pi.label +
      " · 1日 <b class=\"" + cls(s.pct1) + "\">" + pctText(s.pct1) + "</b>" +
      " · 7日 <b class=\"" + cls(s.pct7) + "\">" + pctText(s.pct7) + "</b>" +
      " · 30日 <b class=\"" + cls(s.pct30) + "\">" + pctText(s.pct30) + "</b></div>" +
      '<div class="sigline2">' + esc(hintText(s)) + "</div></div></div>";
  });
  if (!html) html = '<div class="empty">暂无信号数据</div>';
  el.innerHTML = html;
}

function renderTrans() {
  var el = document.getElementById("trans");
  var items = [
    {code:"SC", label:"SC原油"},
    {code:"PP", label:"PP"},
    {code:"L",  label:"PE"},
    {code:"V",  label:"PVC"}
  ];
  var maxAbs = 0.01;
  items.forEach(function(it) {
    var s = (DATA.signals || {})[it.code];
    if (s && s.pct30 !== null && s.pct30 !== undefined) {
      maxAbs = Math.max(maxAbs, Math.abs(s.pct30));
    }
  });
  var html = '<div style="font-size:12px;color:#667085;margin-bottom:2px">近30日涨跌幅对比</div><div class="bars">';
  items.forEach(function(it) {
    var s = (DATA.signals || {})[it.code];
    var v = s ? s.pct30 : null;
    var half = (v === null || v === undefined) ? 0 : Math.abs(v) / maxAbs * 50;
    var color = (v > 0) ? "#d92d20" : "#079455";
    var style = (v >= 0)
      ? "left:50%;width:" + half + "%"
      : "right:50%;width:" + half + "%";
    html += '<div class="bar"><span class="bl">' + it.label + "</span>" +
      '<span class="btrack"><span class="bmid"></span>' +
      '<span class="bfill" style="' + style + ";background:" + color + '"></span></span>' +
      '<span class="bv ' + cls(v) + '">' + pctText(v) + "</span></div>";
  });
  html += "</div>";
  // 比价说明
  var lines = [];
  [["PP", "PP"], ["L", "PE"], ["V", "PVC"]].forEach(function(pair) {
    var s = (DATA.signals || {})[pair[0]];
    if (!s || s.ratio_pos90 === null || s.ratio_pos90 === undefined) return;
    var rel = s.ratio_pos90 >= 80 ? "相对原油偏贵" :
      (s.ratio_pos90 <= 20 ? "相对原油偏便宜" : "处于中间区间");
    lines.push(pair[1] + "/原油比价近90日 <b>" + s.ratio_pos90.toFixed(0) + "%</b> 分位，" + rel);
  });
  if (lines.length) {
    html += '<div style="font-size:12px;color:#475467;margin-top:10px;line-height:1.7">' +
      lines.join("<br>") + "</div>";
  }
  el.innerHTML = html;
}

function renderTabs() {
  var tabs = [
    {key:"all", label:"全部"},
    {key:"plastic", label:"塑料"},
    {key:"crude", label:"原油"},
    {key:"macro", label:"宏观"}
  ];
  document.getElementById("tabs").innerHTML = tabs.map(function(t) {
    return '<button class="' + (NEWS_TAB === t.key ? "on" : "") +
      '" onclick="switchTab(\'' + t.key + '\')">' + t.label + "</button>";
  }).join("");
}

function switchTab(key) {
  NEWS_TAB = key;
  renderTabs();
  renderNews();
}

function newsItems() {
  var n = DATA.news || {};
  if (NEWS_TAB === "all") {
    return [].concat(n.plastic || [], n.crude || [], n.macro || [])
      .sort(function(a, b) { return String(b.time || "").localeCompare(String(a.time || "")); })
      .slice(0, 20);
  }
  return n[NEWS_TAB] || [];
}

function renderNews() {
  var items = newsItems();
  var el = document.getElementById("news");
  if (!items.length) {
    el.innerHTML = '<div class="empty">暂无资讯</div>';
    return;
  }
  el.innerHTML = items.map(function(it) {
    var tag = it.tag && it.tag !== "快讯" ? '<span class="ntag">' + esc(it.tag) + "</span> · " : "";
    return '<a class="news" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      '<div class="ntop"><span>' + tag + esc(it.source) + "</span><span>" +
      esc(shortTime(it.time)) + "</span></div>" +
      '<div class="ntitle">' + esc(it.title) + "</div>" +
      (it.summary && it.summary !== it.title ? '<div class="nsum">' + esc(it.summary) + "</div>" : "") +
      "</a>";
  }).join("");
}

function renderWarn(data) {
  var existing = document.getElementById("warnbar");
  if (existing) existing.remove();
  var ws = (data.warnings || []).length ? data.warnings :
    (data.stale ? ["部分数据抓取失败，已沿用上一版本"] : []);
  if (!ws.length) return;
  var div = document.createElement("div");
  div.id = "warnbar";
  div.className = "warnbar";
  div.textContent = ws.slice(0, 3).join("；");
  document.querySelector(".wrap").insertBefore(div, document.querySelector("section"));
}

function renderAll(data) {
  DATA = data;
  document.getElementById("gen").textContent = data.generated_at || "--";
  renderOil();
  renderPlastic();
  renderSignals();
  renderTrans();
  renderTabs();
  renderNews();
  renderWarn(data);
}

function loadData(manual) {
  var url = "data.json?t=" + Date.now();
  fetch(url, {cache: "no-store"}).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(data) {
    renderAll(data);
    if (manual) {
      var b = document.querySelector(".refresh");
      var old = b.textContent;
      b.textContent = "已更新";
      setTimeout(function() { b.textContent = old; }, 1200);
    }
  }).catch(function(e) {
    var el = document.getElementById("warnbar");
    if (!el) {
      el = document.createElement("div");
      el.id = "warnbar";
      el.className = "warnbar";
      document.querySelector(".wrap").insertBefore(el, document.querySelector("section"));
    }
    el.textContent = "数据加载失败：" + e.message + "（请稍后刷新重试）";
  });
}

loadData(false);
</script>
</body>
</html>
